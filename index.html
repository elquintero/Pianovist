const _p2d = {};
const CAT_ICONS = Object.keys(ICON_PATHS).filter((k) => k !== "ajustes");   // iconos válidos para una categoría
const CAT_ALIAS = { pelicula: "cine", peliculas: "cine", "bandas-sonoras": "cine", mando: "videojuegos", microfono: "pop", saxo: "jazz", saxofon: "jazz", folk: "tradicional", violin: "tradicional", banjo: "tradicional", pandereta: "tradicional", ejercicios: "metronomo" };   // otros nombres válidos para el campo "icono"
const CAT_COL = { pop: "#e0457b", clasica: "#5b95f5", disney: "#e8a93a", cine: "#9a7cf5", anime: "#3fb87f", jazz: "#b86ae6", infantil: "#f0a030", tradicional: "#d97b4a", navidad: "#e0524d", videojuegos: "#4fc3f7", metronomo: "#9ccc65" };
// si el json no indica un icono conocido, se busca por el nombre de la categoría
const CAT_WORDS = {
  pop: ["pop"], clasica: ["clasic", "barroco", "romantic", "orquesta", "sinfon"], disney: ["disney", "pixar", "animacion", "dibujos"], cine: ["cine", "pelicul", "banda sonora", "bandas sonoras", "soundtrack", "serie"],
  anime: ["anime", "manga", "japon"], jazz: ["jazz", "blues", "swing", "soul"], infantil: ["infantil", "nino", "nina", "cole", "escuela", "cancion de cuna"], navidad: ["navid", "villancico"],
  tradicional: ["tradicion", "popular", "folclor", "folklor", "regional", "folk"], videojuegos: ["videojuego", "juego", "game", "gaming", "nintendo", "retro"], metronomo: ["ejercicio", "escala", "tecnica", "practica", "estudio"]
};
function resolveIcon(c) {
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const al = CAT_ALIAS[norm(c.icono)] || c.icono;
  if (CAT_ICONS.includes(al)) return al;
  const t = norm(c.icono) + " " + norm(c.id) + " " + norm(c.nombre);
  for (const k in CAT_WORDS) if (CAT_WORDS[k].some((w) => t.includes(w))) return k;
  return "nota";
}

const DEFC={clasica:['Clásica','Música clásica o relacionada con la misma.'],infantil:['Infantil','Canciones sencillas para empezar.'],navidad:['Navidad','Villancicos y canciones de fiesta.'],ejercicios:['Ejercicios','Escalas y arpegios para practicar.'],tradicional:['Tradicional','Melodías populares de siempre.'],pop:['Pop',''],disney:['Disney',''],cine:['Cine y series',''],anime:['Anime',''],jazz:['Jazz y blues',''],videojuegos:['Videojuegos',''],otras:['Otras','']};
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'otras';
const DB=(()=>{let p;const op=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('sightkeys',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(m,f)=>{const d=await op();return new Promise((res,rej)=>{const t=d.transaction('songs',m),q=f(t.objectStore('songs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
return{all:()=>tx('readonly',s=>s.getAll()),put:r=>tx('readwrite',s=>s.put(r)),del:id=>tx('readwrite',s=>s.delete(id))}})();
let songs=[],curCat=null;
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const catInfo=(id,name)=>{const d=DEFC[id],nombre=d?d[0]:(name||id),ic=resolveIcon({icono:id,id,nombre});return{id,nombre,desc:d?d[1]:'',ic,col:CAT_COL[ic]||'#e8820c'}};
const svgIcon=(ic,col)=>{const ip=ICON_PATHS[ic]||ICON_PATHS.nota,b=ip[1],ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg'),pa=document.createElementNS(ns,'path');s.setAttribute('viewBox',b.join(' '));pa.setAttribute('d',ip[0]);pa.setAttribute('fill',col);s.appendChild(pa);return s};
const chev=()=>{const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg'),pa=document.createElementNS(ns,'path');s.setAttribute('class','cv');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2.4');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');pa.setAttribute('d','M9 5l7 7-7 7');s.appendChild(pa);return s};
const tint=(c,a)=>{const n=parseInt(c.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
async function loadSongs(){try{songs=await DB.all()}catch{songs=[]}songs.sort((a,b)=>a.title.localeCompare(b.title,'es'))}
function cats(){const m=new Map();for(const s of songs){if(!m.has(s.cat))m.set(s.cat,{...catInfo(s.cat,s.catName),n:0});m.get(s.cat).n++}return[...m.values()].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))}
function renderHome(){const w=$('hw');w.textContent='';const ci=curCat?catInfo(curCat,(songs.find(s=>s.cat==curCat)||{}).catName):null;

if(!ci){w.append(h('div','hint','Elige una categoría'));for(const c of cats()){const b=h('button','hc'),tl=h('span','tl'),tx=h('span','tx');tl.style.background=tint(c.col,.16);tl.append(svgIcon(c.ic,c.col));tx.append(h('b',0,c.nombre));if(c.desc)tx.append(h('small',0,c.desc));b.append(tl,tx,h('span','n',String(c.n)),chev());b.onclick=()=>{curCat=c.id;history.pushState({v:'cat',id:c.id},'');renderHome();$('hl').scrollTop=0};w.append(b)}return}
w.append(h('div','hint','Elige una canción para tocarla'));for(const s of songs.filter(x=>x.cat==curCat)){const b=h('button','hc'),tl=h('span','tl'),tx=h('span','tx');tl.style.background=tint(ci.col,.16);tl.append(svgIcon('nota',ci.col));tx.append(h('b',0,s.title));if(s.author)tx.append(h('small',0,s.author));b.append(tl,tx,chev());b.onclick=()=>playSong(s);w.append(b)}}

curCat=st.v=='cat'?st.id:null;showHome()});
