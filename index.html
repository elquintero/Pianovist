<script>
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d'),kv=$('kv'),kc=kv.getContext('2d');

const pressed=new Set(),voices={};
const hs={L:0,R:0},isSel=n=>(!hs.L&&!hs.R)||(hs.L&&hs.R)||(n.hand=='L'?hs.L:hs.R),live=n=>!n.rest&&!n.tc,GREEN='#1f9d55';
/* una nota cuenta como "marcada" si ya está acertada o el cursor ya la ha pasado (también al arrastrar la partitura) */
function doneN(n){const o=n.par||n;if(o.st=='hit')return true;if(o.st=='miss'||!isSel(o))return false;return n.t<pos-.001&&!(mode=='tempo'&&n.t>=lo)}
function noteCol(n){const o=n.par||n;if(mode=='listen'&&o.t>=ps-.001&&n.t<=pos&&pos<n.t+n.dur)return o.hand=='L'?C.hr:C.ex;
if(o.st=='hit')return GREEN;if(o.st=='miss')return '#d63c3c';if(!isSel(o))return C.gr;return doneN(n)?GREEN:C.ink}
const say=h=>$('st').innerHTML=h;
const TH={clasico:{ln:'#222',ink:'#1c1c1c',gr:'#aaa',kw:'#fff',kb:'#222',kl:'#999',cur:'#e8820c',hr:'#34a853',ac:'#e8820c',ex:'#4aa3e8',ex2:'#2b78b8',pa:'#fbf9f3'},
negro:{ln:'#7d7d85',ink:'#e6e6e6',gr:'#55555c',kw:'#d6d6da',kb:'#101012',kl:'#444',cur:'#1b84c4',hr:'#3ddc97',ac:'#1b84c4',ex:'#5bb8e8',ex2:'#2f86b8',pa:'#08080a'}};let C=TH.clasico;
/* ---------- fuente ---------- */
async function chkFont(){await document.fonts.load('40px Bravura','\uE050\uE062\uE0A4\uE262\uE080').then(l=>fontOK=l.length>0,()=>0);if(!fontOK)say('No encuentro <b>fonts/Bravura.otf</b>.')}
function theme(t){C=TH[t]||TH.clasico;document.documentElement.dataset.t=t;$('th').value=t;try{localStorage.lp=t}catch{}}
/* ---------- audio ---------- */
function AC(){if(!ac){ac=new AudioContext();mg=ac.createGain();mg.gain.value=vol*2;const cp=ac.createDynamicsCompressor();mg.connect(cp);cp.connect(ac.destination)}}
function A(){AC();if(ac.state!='running')ac.resume();if(!A.d){A.d=1;pPre(rng(48,84))}}
/* piano real: muestras mp3 en Sound/ (una por semitono: C4.mp3, Cs4.mp3 = Do#4...) */
const SN=['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'],pName=m=>SN[m%12]+(Math.floor(m/12)-1),rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const PAV={2:new Set([50, 53, 55, 57, 58, 59, 60, 62, 64, 66, 67, 69, 71, 72, 73, 74, 76, 77, 79, 81]),3:new Set([36, 41, 42, 43, 44, 47, 48, 50, 51, 52, 53, 55, 56, 57, 58, 59, 60, 62, 63, 64, 65, 66, 67, 69, 71, 72, 73, 74, 76, 77, 79, 81]),4:new Set([36, 41, 42, 43, 44, 47, 48, 50, 51, 52, 53, 55, 56, 57, 58, 59, 60, 62, 63, 64, 65, 66, 67, 69, 71, 72, 73, 74, 76, 77, 79, 81])},PB=new Map(),PLD=new Set(),PBAD=new Set(),PQ=[];let PIANO=true,PACT=0;
/* muestras: Sound/<capa>/<nota>.mp3 · capa 2 = suave, 3 = media, 4 = fuerte (según la velocidad con la que pulsas) */
const pk=(L,m)=>L*1000+m,layerOf=(v,m)=>{const L=v<.4?2:v<.72?3:4;return L==2&&m<50?3:L};
function pSrc(L,m){let b=null,bd=99;for(const x of PAV[L]){const d=Math.abs(x-m);if(d<bd){bd=d;b=x}}return b}
function pTrim(b){try{const n=Math.min(b.length,Math.ceil(b.sampleRate*6)),o=ac.createBuffer(b.numberOfChannels,n,b.sampleRate),f=Math.floor(b.sampleRate*.4);
for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c).slice(0,n);if(n<b.length)for(let i=0;i<f;i++)d[n-1-i]*=i/f;o.copyToChannel(d,c)}return o}catch{return b}}
function pLoad(k){const L=k/1000|0,m=k%1000;return fetch('Sound/'+L+'/'+pName(m)+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
.then(ab=>new Promise((ok,ko)=>{const q=ac.decodeAudioData(ab,ok,ko);q&&q.catch&&q.catch(ko)})).then(b=>{PB.set(k,pTrim(b))}).catch(()=>{PBAD.add(k)})}
function pPump(){while(PACT<4&&PQ.length){const k=PQ.shift();PACT++;pLoad(k).then(()=>{PACT--;PLD.delete(k);pStat();pPump()})}}
function pPre(ms,L=3){if(!PIANO)return;AC();for(const m of ms){if(m<21||m>108)continue;const LL=L==2&&m<50?3:L,k=pk(LL,pSrc(LL,m));if(!PB.has(k)&&!PLD.has(k)&&!PBAD.has(k)){PLD.add(k);PQ.push(k)}}pPump()}
function pGet(m,v){const L=layerOf(v,m),src=pSrc(L,m),b=PB.get(pk(L,src));if(b)return[b,2**((m-src)/12)];pPre([m],L);
let best=null,bd=1e9;for(const[kk,bb]of PB){const mm=kk%1000,d=Math.abs(mm-m)+((kk/1000|0)==L?0:.5);if(d<bd){bd=d;best=[bb,2**((m-mm)/12)]}}return bd<=14?best:null}
function pStat(){const e=$('ps');if(!e)return;e.textContent=PIANO?'Muestras cargadas: '+PB.size+' · 3 intensidades · C2–A5 (fuera de ese rango se transpone)':'Sintetizador'}
function tone(m,w,d,v=.7){if(PIANO){const q=pGet(m,v);if(q)return smp(q[0],q[1],w,d,v)}return synth(m,w,d,v)}
function smp(b,r,w,d,v){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=r;
g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(3.4*(.7+.3*v),w+.004);s.connect(g);g.connect(mg);s.start(w);let x=0;
const rel=t=>{if(x)return;x=1;t=Math.max(t,w+.01);g.gain.setTargetAtTime(0,t,.09);try{s.stop(t+.7)}catch{}};if(d)rel(w+d);return rel}
function synth(m,w,d,v=.7){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),f=440*2**((m-69)/12);
o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(.3*v,w+.01);g.gain.setTargetAtTime(.08*v,w+.01,.5);
o.connect(g);o2.connect(g);g.connect(mg);o.start(w);o2.start(w);
const r=t=>{g.gain.setTargetAtTime(0,t,.1);o.stop(t+.8);o2.stop(t+.8)};if(d)r(w+d);return r}
function click(w,acc){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=acc?1500:1000;o.type='square';
g.gain.setValueAtTime(.15,w);g.gain.exponentialRampToValueAtTime(.001,w+.05);o.connect(g);g.connect(mg);o.start(w);o.stop(w+.06)}
/* ---------- parsers ---------- */
const STEP={C:0,D:1,E:2,F:3,G:4,A:5,B:6},SEMI=[0,2,4,5,7,9,11],PCS=[0,0,1,1,2,3,3,4,4,5,5,6],PCA=[0,1,0,1,0,0,1,0,1,0,1,0];
