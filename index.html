<script>
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d');
const S=10,Y=[150,270],BOT=[30,18],PXB=90,HDR=150,CX=HDR+70,SH=335;let Z=1,H=430,KY=345,mg,vol=.6,xp=0,lo=-1,dr=null,fr=-1e9,ps=-1e9,KH=85;
let song=null,mode='idle',pos=0,bpm=80,t0=0,sp0=0,nb=0,ni=0,ac,fontOK=false,W=600,wrong=0,hits=0,miss=0;
const pressed=new Set(),voices={};
const isSel=n=>$('hand').value=='B'||n.hand==$('hand').value;
const say=h=>$('st').innerHTML=h;
const TH={clasico:{ln:'#333',ink:'#1c1c1c',gr:'#aaa',kw:'#fff',kb:'#222',kl:'#999',cur:'#e0892b',hr:'#34a853',ac:'#f2b134',ex:'#4aa3e8',ex2:'#2b78b8',pa:'#fbf9f3'},
negro:{ln:'#7d7d85',ink:'#e6e6e6',gr:'#55555c',kw:'#d6d6da',kb:'#101012',kl:'#444',cur:'#1b84c4',hr:'#3ddc97',ac:'#1b84c4',ex:'#5bb8e8',ex2:'#2f86b8',pa:'#08080a'}};let C=TH.clasico;
/* ---------- fuente ---------- */
const db=()=>new Promise((ok,ko)=>{const r=indexedDB.open('lpiano',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=ko});
const idb=async(m,k,v)=>{const d=await db();return new Promise(ok=>{const o=d.transaction('k',m).objectStore('k'),r=m=='readwrite'?o.put(v,k):o.get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok()})};
async function useFont(b){const f=new FontFace('Bravura',b);document.fonts.add(await f.load());fontOK=true;$('fs').textContent='Bravura cargada y guardada en este navegador'}
async function chkFont(){try{const b=await idb('readonly','font');if(b){await useFont(b);return}}catch{}

$('ff').onchange=async e=>{const b=await e.target.files[0].arrayBuffer();await useFont(b.slice(0));idb('readwrite','font',b)};
function theme(t){C=TH[t]||TH.clasico;document.documentElement.dataset.t=t;$('th').value=t;try{localStorage.lp=t}catch{}}
/* ---------- audio ---------- */
function AC(){if(!ac){ac=new AudioContext();mg=ac.createGain();mg.gain.value=vol*2;const cp=ac.createDynamicsCompressor();mg.connect(cp);cp.connect(ac.destination)}}
function A(){AC();if(ac.state!='running')ac.resume();if(!A.d){A.d=1;pPre(rng(48,84))}}
/* piano real: muestras mp3 en Sound/ (una por semitono: C4.mp3, Cs4.mp3 = Do#4...) */
const SN=['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'],pName=m=>SN[m%12]+(Math.floor(m/12)-1),rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const PB=new Map(),PLD=new Set(),PMISS=new Set(),PQ=[];let PIANO=true,PACT=0;
function pTrim(b){try{const n=Math.min(b.length,Math.ceil(b.sampleRate*6)),o=ac.createBuffer(b.numberOfChannels,n,b.sampleRate),f=Math.floor(b.sampleRate*.4);

function pLoad(m){return fetch('Sound/'+pName(m)+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
.then(ab=>new Promise((ok,ko)=>{const q=ac.decodeAudioData(ab,ok,ko);q&&q.catch&&q.catch(ko)})).then(b=>{PB.set(m,pTrim(b))}).catch(()=>{PMISS.add(m);pPre([m<27?27:m>94?94:m-1,m<27?28:m>94?93:m+1])})}
function pPump(){while(PACT<4&&PQ.length){const m=PQ.shift();PACT++;pLoad(m).then(()=>{PACT--;PLD.delete(m);pStat();pPump()})}}
function pPre(ms){if(!PIANO)return;AC();for(const m of ms)if(m>=21&&m<=108&&!PB.has(m)&&!PLD.has(m)&&!PMISS.has(m)){PLD.add(m);PQ.push(m)}pPump()}
function pNear(m){const mx=PMISS.has(m)?14:2;for(let d=1;d<=mx;d++)for(const k of[m-d,m+d])if(PB.has(k))return[PB.get(k),2**((m-k)/12)];return null}
function pStat(){const e=$('ps');if(!e)return;const ms=[...PMISS].sort((a,b)=>a-b).map(pName);
e.textContent=PIANO?'Muestras cargadas: '+PB.size+(ms.length?' · faltan en Sound: '+ms.join(', ')+' (se usa la nota vecina)':''):'Sintetizador'}
function tone(m,w,d,v=.7){if(PIANO){let b=PB.get(m),r=1;if(!b){pPre([m]);const q=pNear(m);if(q){b=q[0];r=q[1]}}if(b)return smp(b,r,w,d,v)}return synth(m,w,d,v)}
function smp(b,r,w,d,v){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=r;
g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(.15+.45*v,w+.004);s.connect(g);g.connect(mg);s.start(w);let x=0;
const rel=t=>{if(x)return;x=1;t=Math.max(t,w+.01);g.gain.setTargetAtTime(0,t,.09);try{s.stop(t+.7)}catch{}};if(d)rel(w+d);return rel}
function synth(m,w,d,v=.7){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),f=440*2**((m-69)/12);
o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(.3*v,w+.01);g.gain.setTargetAtTime(.08*v,w+.01,.5);
o.connect(g);o2.connect(g);g.connect(mg);o.start(w);o2.start(w);
const r=t=>{g.gain.setTargetAtTime(0,t,.1);o.stop(t+.8);o2.stop(t+.8)};if(d)r(w+d);return r}
function click(w,acc){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=acc?1500:1000;o.type='square';
g.gain.setValueAtTime(.15,w);g.gain.exponentialRampToValueAtTime(.001,w+.05);o.connect(g);g.connect(mg);o.start(w);o.stop(w+.06)}
/* ---------- parsers ---------- */
const STEP={C:0,D:1,E:2,F:3,G:4,A:5,B:6},SEMI=[0,2,4,5,7,9,11],PCS=[0,0,1,1,2,3,3,4,4,5,5,6],PCA=[0,1,0,1,0,0,1,0,1,0,1,0];
function parseXML(txt){
const d=new DOMParser().parseFromString(txt,'text/xml');if(d.querySelector('parsererror'))throw Error('XML no válido');
const q=(e,s)=>e.querySelector(s)?.textContent,ev=[],bars=[];let fifths=0,ts=[4,4],tempo=0;
[...d.querySelectorAll('part')].forEach((p,pi)=>{let div=1,t=0,last=0;const ties={};
for(const m of p.children){if(m.tagName!='measure')continue;if(pi==0)bars.push(t);
for(const e of m.children){const g=e.tagName;
if(g=='attributes'){div=+q(e,'divisions')||div;if(pi==0){if(e.querySelector('fifths'))fifths=+q(e,'fifths');if(e.querySelector('beats'))ts=[+q(e,'beats'),+q(e,'beat-type')]}}
else if(g=='direction'){const s=e.querySelector('sound[tempo]');if(s&&!tempo)tempo=+s.getAttribute('tempo')}
else if(g=='backup')t-=q(e,'duration')/div;else if(g=='forward')t+=q(e,'duration')/div;
else if(g=='note'){if(e.querySelector('grace'))continue;const dur=q(e,'duration')/div,ch=e.querySelector('chord'),on=ch?last:t;last=on;if(!ch)t+=dur;
const hand=(pi>0||q(e,'staff')==2)?'L':'R';
if(e.querySelector('rest')){ev.push({t:on,dur,rest:1,hand});continue}
const st=q(e,'step'),al=+(q(e,'alter')||0),oc=+q(e,'octave'),mid=12*(oc+1)+SEMI[STEP[st]]+al,k=mid+hand;
if(e.querySelector('tie[type=stop]')&&ties[k]){ties[k].dur+=dur;if(!e.querySelector('tie[type=start]'))delete ties[k];continue}
const n={t:on,dur,midi:mid,pos:oc*7+STEP[st],step:STEP[st],alter:al,hand,vo:q(e,'voice'),bms:[...e.querySelectorAll('beam')].map(b=>[+b.getAttribute('number'),b.textContent])};ev.push(n);if(e.querySelector('tie[type=start]'))ties[k]=n}}}});
return fin(ev,bars,tempo||90,fifths,ts)}
function parseMID(buf){const u=new Uint8Array(buf),v=new DataView(buf),div=v.getUint16(12),nt=v.getUint16(10),ev=[];let p=14,tempo=0,ts=[4,4];
for(let k=0;k<nt;k++){const len=v.getUint32(p+4);let i=p+8,tm=0,rs=0;const end=i+len,on={};
const vl=()=>{let x=0,b;do{b=u[i++];x=x<<7|b&127}while(b&128);return x};
while(i<end){tm+=vl();let s=u[i];if(s&128){i++;if(s<240)rs=s}else s=rs;
if(s==255){const ty=u[i++],l=vl();if(ty==81&&!tempo)tempo=6e7/(u[i]<<16|u[i+1]<<8|u[i+2]);if(ty==88&&k<2)ts=[u[i],2**u[i+1]];i+=l}
else if(s==240||s==247)i+=vl();
else{const kd=s>>4,a=u[i++],b=(kd==12||kd==13)?0:u[i++];
if(kd==9&&b>0)on[a]=tm;else if((kd==8||kd==9)&&on[a]!=null){const pc=a%12,oc=Math.floor(a/12)-1;
ev.push({t:on[a]/div,dur:(tm-on[a])/div,midi:a,pos:oc*7+PCS[pc],step:PCS[pc],alter:PCA[pc],hand:a<60?'L':'R'});delete on[a]}}}
p=end}
return fin(ev,[],tempo||120,0,ts)}
function fin(ev,bars,tempo,fifths,ts){ev.sort((a,b)=>a.t-b.t);
const grps=[],open={};
for(const n of ev){const b1=n.bms&&n.bms.find(x=>x[0]==1);if(!b1)continue;const k=n.hand+n.vo,v=b1[1];
if(v=='begin'&&!(open[k]&&open[k].it.at(-1).t==n.t))open[k]={hand:n.hand,it:[]};
const g=open[k];if(!g)continue;const l=g.it.at(-1);if(l&&Math.abs(l.t-n.t)<.001)l.ns.push(n);else g.it.push({t:n.t,ns:[n]});
n.grp=g;if(v=='end'){if(g.it.length>1)grps.push(g);else g.it[0].ns.forEach(m=>delete m.grp);delete open[k]}}const end=Math.max(...ev.map(n=>n.t+n.dur)),bm=ts[0]*4/ts[1];
if(bars.length<2){bars=[];for(let b=0;b<=end;b+=bm)bars.push(b)}
const ka=[0,0,0,0,0,0,0],o=fifths>0?[3,0,4,1,5,2,6]:[6,2,5,1,4,0,3];for(let i=0;i<Math.abs(fifths);i++)ka[o[i]]=fifths>0?1:-1;
const ch={};for(const n of ev)if(!n.rest)(ch[n.hand+Math.round(n.t*1000)]??=[]).push(n);
const farUp=l=>{const mid=BOT[l[0].hand=='R'?0:1]+4;return l.reduce((a,n)=>Math.abs(n.pos-mid)>Math.abs(a-mid)?n.pos:a,mid)<mid};
for(const g of grps)for(const it of g.it)for(const m of ch[g.hand+Math.round(it.t*1000)]||[])if(!m.grp){m.grp=g;it.ns.push(m)}
for(const l of Object.values(ch)){const u=farUp(l);l.forEach(n=>n.up=u);l.sort((a,b)=>a.pos-b.pos);
for(let i=1;i<l.length;i++)if(l[i].pos-l[i-1].pos==1&&!l[i-1].sec){l[i].sec=1;l[i-1].sec=-1}}
for(const g of grps){const all=g.it.flatMap(i=>i.ns);g.up=farUp(all);all.forEach(n=>n.up=g.up)}
const on=[];for(const n of ev){const k=Math.round(n.t*1000)/1000;if(!on.length||on.at(-1).t!=k)on.push({t:k,a:0,s:0});const o=on.at(-1);if(!n.rest&&n.alter!=ka[n.step])o.a=1;if(n.sec)o.s=1}
const T=on.map(o=>o.t),XS=[0];for(let i=1;i<on.length;i++)XS.push(XS[i-1]+Math.max(36+14*on[i].a+10*on[i-1].s,(T[i]-T[i-1])*PXB));
return{ev,bars,tempo:Math.round(tempo),fifths,ts,bm,end,ka,grps,T,XS}}
async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf);let e=buf.byteLength-22;while(v.getUint32(e,true)!=0x06054b50)e--;
let n=v.getUint16(e+10,true),p=v.getUint32(e+16,true);
for(;n--;){const cm=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),kl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),
nm=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+kl;
if(nm.startsWith('META-INF')||!/\.(xml|musicxml)$/i.test(nm))continue;
const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),raw=u.subarray(ds,ds+cs);
if(!cm)return new TextDecoder().decode(raw);

throw Error('El .mxl no contiene MusicXML')}
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;stop();
try{const x=f.name.toLowerCase().split('.').pop();
song=x=='mxl'?parseXML(await unzip(await f.arrayBuffer())):/^mid/.test(x)?parseMID(await f.arrayBuffer()):parseXML(await f.text());
$('bpm').value=song.tempo;setBpm();pos=0;pPre([...new Set(song.ev.filter(n=>!n.rest).map(n=>n.midi))].sort((a,b)=>a-b));
say(`<b>${f.name}</b> cargado: ${song.ev.filter(n=>!n.rest).length} notas, compás ${song.ts.join('/')}.`+(/mid/.test(x)?' (MIDI: manos separadas por altura, sin ritmos escritos exactos).':''))}
catch(err){song=null;say('No se pudo leer el archivo: '+err.message)}};
/* ---------- MIDI ---------- */
function initMidi(){if(!navigator.requestMIDIAccess){$('mi').innerHTML='<option>Web MIDI no disponible (usa Chrome/Edge)</option>';return}
navigator.requestMIDIAccess().then(m=>{const fill=()=>{const s=$('mi');s.innerHTML='';const ins=[...m.inputs.values()];
if(!ins.length)s.innerHTML='<option>Sin teclado</option>';ins.forEach(i=>s.add(new Option(i.name,i.id)));sel()};
const sel=()=>{m.inputs.forEach(i=>i.onmidimessage=null);const i=m.inputs.get($('mi').value);if(i)i.onmidimessage=onmsg};
m.onstatechange=fill;$('mi').onchange=sel;fill()},()=>{$('mi').innerHTML='<option>Permiso MIDI denegado</option>'})}
function onmsg(e){const[s,a,b]=e.data,k=s&240;if(k==144&&b>0)down(a,b/127);else if(k==128||k==144)up(a)}
function up(m){pressed.delete(m);voices[m]&&voices[m](ac.currentTime);delete voices[m]}
function down(m,v){A();pressed.add(m);if(voices[m])voices[m](ac.currentTime);voices[m]=tone(m,ac.currentTime,0,v);if(!song)return;
if(mode=='tempo'){let b=null;for(const n of song.ev)if(!n.rest&&!n.st&&n.midi==m&&isSel(n)&&Math.abs(n.t-pos)<.6&&(!b||Math.abs(n.t-pos)<Math.abs(b.t-pos)))b=n;
if(b){b.st='hit';hits++}else wrong++;stat()}
else if(mode=='wait'&&!dr){const g=group(),n=g.find(x=>x.midi==m&&!x.st);if(n){n.st='hit';hits++}else wrong++;stat()}}
const group=()=>{const l=song.ev.filter(n=>!n.rest&&!n.st&&isSel(n)&&n.t>=lo);if(!l.length)return[];const t=l[0].t;return l.filter(n=>Math.abs(n.t-t)<.01)};
const stat=()=>say(`Aciertos <b>${hits}</b> · Fallos <b>${miss}</b> · Notas erróneas <b>${wrong}</b>`);
/* ---------- transporte ---------- */
function setBpm(){const nb_=+$('bpm').value;if(mode=='listen'||mode=='tempo'){sp0=pos;t0=ac.currentTime}bpm=nb_;$('bv').textContent=bpm}
$('bpm').oninput=setBpm;
function start(m){if(!song)return say('Primero carga una canción.');A();const pp=Math.max(pos,fr),f0=pp>song.end-.5||pp<0?0:(song.T.find(t=>t>=pp-.05)??0);stop();lo=f0-.01;song.ev.forEach(n=>delete n.st);hits=wrong=miss=0;
mode=m;if(m=='wait'){pos=f0;stat();return}
const ci=$('ci').value=='bm'?song.bm:+$('ci').value;fr=f0;ps=f0;sp0=f0-ci;pos=sp0;t0=ac.currentTime+.1;nb=ci?sp0:Math.ceil(f0-.001);ni=Math.max(0,song.ev.findIndex(n=>n.t>=f0-.001));stat()}
function stop(){if(pos<fr)pos=fr;fr=-1e9;if(mode!='idle'&&mode!='')mode='idle';Object.keys(voices).forEach(k=>up(+k))}
$('pl').onclick=()=>start('listen');$('pr').onclick=()=>start($('mode').value);$('sp').onclick=()=>{stop()};
function finish(){const tot=hits+miss;mode='idle';say(`Terminado: <b>${tot?Math.round(100*hits/tot):0}%</b> de precisión · ${hits} aciertos, ${miss} fallos, ${wrong} notas erróneas.`)}
setInterval(()=>{if(mode!='listen'&&mode!='tempo')return;const lim=ac.currentTime+.2,tb=b=>t0+(b-sp0)*60/bpm;
while(tb(nb)<lim){if(nb<ps-.001){click(tb(nb),Math.abs(nb-sp0)<.001);nb++;if(nb>=ps-.001)nb=Math.ceil(ps-.001)}
else{if($('met').checked)click(tb(nb),nb%song.bm==0);nb++}}
while(ni<song.ev.length&&tb(song.ev[ni].t)<lim){const n=song.ev[ni++];if(!n.rest&&(mode=='listen'||($('oth').checked&&!isSel(n))))try{tone(n.midi,Math.max(tb(n.t),ac.currentTime),(n.dur>0?n.dur:.25)*60/bpm)}catch(e){}}},30);
/* ---------- dibujo ---------- */
const GL={g:'\uE050',f:'\uE062',b:'\uE260',n:'\uE261',s:'\uE262',w:'\uE0A2',h:'\uE0A3',q:'\uE0A4'};
const yOf=(r,p)=>Y[r]-(p-BOT[r])*S/2;
function G(ch,x,y){c.fillText(ch,x,y)}
function XT(t){const T=song.T,XS=song.XS,n=T.length;if(t<=T[0])return XS[0]+(t-T[0])*PXB;if(t>=T[n-1])return XS[n-1]+(t-T[n-1])*PXB;
let a=0,b=n-1;while(b-a>1){const m=(a+b)>>1;T[m]<=t?a=m:b=m}return XS[a]+(t-T[a])/(T[b]-T[a])*(XS[b]-XS[a])}
function invX(x){const T=song.T,XS=song.XS,n=T.length;if(x<=XS[0])return T[0]+(x-XS[0])/PXB;if(x>=XS[n-1])return T[n-1]+(x-XS[n-1])/PXB;
let a=0,b=n-1;while(b-a>1){const m=(a+b)>>1;XS[m]<=x?a=m:b=m}return T[a]+(x-XS[a])/(XS[b]-XS[a])*(T[b]-T[a])}
function seek(p){fr=-1e9;p=Math.max(-song.bm,Math.min(song.end,p));pos=p;ps=p;
if(mode=='listen'||mode=='tempo'){sp0=p;t0=ac.currentTime;nb=Math.ceil(p);ni=song.ev.findIndex(n=>n.t>=p);if(ni<0)ni=song.ev.length;lo=p-.3;
song.ev.forEach(n=>{if(n.t>=lo)delete n.st});hits=song.ev.filter(n=>n.st=='hit').length;miss=song.ev.filter(n=>n.st=='miss').length}
else if(mode=='wait'){lo=p-.01;song.ev.forEach(n=>{if(n.t>=lo)delete n.st})}}
function drawNote(n,x,col){const hx=x+((n.up&&n.sec==1)?11.8:(!n.up&&n.sec==-1)?-11.8:0),r=n.hand=='R'?0:1,y=yOf(r,n.pos),d=[4,3,2,1.5,1,.75,.5,.25].find(v=>n.dur>=v*.88)||.25;
c.fillStyle=c.strokeStyle=col;c.lineWidth=1.5;
for(let p=BOT[r]-2;p>=n.pos;p-=2){const yy=yOf(r,p);c.beginPath();c.moveTo(hx-11,yy);c.lineTo(hx+11,yy);c.stroke()}
for(let p=BOT[r]+10;p<=n.pos;p+=2){const yy=yOf(r,p);c.beginPath();c.moveTo(hx-11,yy);c.lineTo(hx+11,yy);c.stroke()}
if(fontOK){c.font=`${4*S}px Bravura`;G(d>=4?GL.w:d>=2?GL.h:GL.q,hx-6,y)}else{c.beginPath();c.ellipse(hx,y,6,4.5,-.4,0,7);d>=2?c.stroke():c.fill()}
if(d<4&&!n.grp){const up=n.up,sx=up?x+5.4:x-5.4,ey=up?y-33:y+33;c.beginPath();c.moveTo(sx,y);c.lineTo(sx,ey);c.stroke();
if(d<=.5&&fontOK)G(String.fromCodePoint((d<.5?0xE242:0xE240)+(up?0:1)),sx,ey)}
if([3,1.5,.75].includes(d)){c.beginPath();c.arc(hx+11,y-(n.pos%2?0:S/2),2,0,7);c.fill()}
if(fontOK&&n.alter!=song.ka[n.step]){c.font=`${4*S}px Bravura`;G(n.alter>0?GL.s:n.alter<0?GL.b:GL.n,hx-22,y)}}
function drawBeams(){for(const g of song.grps){const r=g.hand=='R'?0:1,mid=BOT[r]+4,all=g.it.flatMap(i=>i.ns);
const far=all.reduce((a,n)=>Math.abs(n.pos-mid)>Math.abs(a-mid)?n.pos:a,mid),up=g.up,sx=up?5.4:-5.4;
const ext=g.it.map(i=>{const ys=i.ns.map(n=>yOf(r,n.pos));return[Math.min(...ys),Math.max(...ys),CX+XT(i.t)-xp]});
if(ext.at(-1)[2]<HDR-30||ext[0][2]>W+30)continue;
const X=ext.map(e=>e[2]+sx),req=ext.map(e=>up?e[0]-30:e[1]+30),x0=X[0];
const s=Math.max(-S*1.2,Math.min(S*1.2,req.at(-1)-req[0]))/Math.max(1,X.at(-1)-x0);
const ys=req.map((q,i)=>q-s*(X[i]-x0)),a=up?Math.min(...ys):Math.max(...ys),Yb=x=>a+s*(x-x0),d=up?1:-1;
c.fillStyle=c.strokeStyle=all.every(n=>n.st=='hit')?'#1f9d55':!isSel(all[0])?C.gr:C.ink;c.lineWidth=1.5;
ext.forEach((e,i)=>{c.beginPath();c.moveTo(X[i],up?e[1]:e[0]);c.lineTo(X[i],Yb(X[i]));c.stroke()});
const poly=(xa,xb,o)=>{const ya=Yb(xa)+d*o,yb=Yb(xb)+d*o;c.beginPath();c.moveTo(xa,ya);c.lineTo(xb,yb);c.lineTo(xb,yb+d*4.5);c.lineTo(xa,ya+d*4.5);c.fill()};
for(let l=1;l<=4;l++){let st=null;g.it.forEach((it,i)=>{const b=it.ns[0].bms.find(x=>x[0]==l),v=b&&b[1];
if(v=='begin')st=i;else if(v=='end'&&st!=null){poly(X[st],X[i],(l-1)*7);st=null}
else if(v=='forward hook')poly(X[i],X[i]+9,(l-1)*7);else if(v=='backward hook')poly(X[i]-9,X[i],(l-1)*7)})}}}
function drawRest(n,x,col){const r=n.hand=='R'?0:1;if(!fontOK)return;c.fillStyle=col;c.font=`${4*S}px Bravura`;
const k=n.dur>=4?0:n.dur>=2?1:n.dur>=1?2:n.dur>=.5?3:4;G(String.fromCodePoint(0xE4E3+k),x-5,Y[r]-(k==0?3:2)*S)}
const TS=[[38,35,39,36,33,37,34],[24,28,25,29,26,30,27]],TF=[[34,37,33,36,32,35,31],[20,23,19,22,18,21,17]];
function draw(){c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);c.clearRect(0,0,W,H);const Wr=W;W=Wr/Z;c.save();c.scale(Z,Z);c.lineWidth=1;c.strokeStyle=C.ln;
for(let r=0;r<2;r++)for(let l=0;l<5;l++){c.beginPath();c.moveTo(0,Y[0]*0+Y[r]-l*S);c.lineTo(W,Y[r]-l*S);c.stroke()}
if(song){xp=XT(Math.max(pos,fr));const exp=new Set();
if(mode=='tempo')song.ev.forEach(n=>{if(!n.rest&&!n.st&&isSel(n)&&n.t>pos-.3&&n.t<pos+.5)exp.add(n.midi)});
if(mode=='wait')group().forEach(n=>exp.add(n.midi));
const hear=new Map();if(mode=='listen'||mode=='tempo')song.ev.forEach(n=>{if(!n.rest&&n.t>=ps-.001&&n.t<=pos&&pos<n.t+n.dur&&(mode=='listen'||(!isSel(n)&&$('oth').checked)))hear.set(n.midi,n.hand)});
c.save();c.beginPath();c.rect(HDR,0,W-HDR,SH);c.clip();
c.strokeStyle=C.ln;for(const b of song.bars){const x=CX+XT(b)-xp-16;if(x<HDR||x>W)continue;c.beginPath();c.moveTo(x,Y[0]-4*S);c.lineTo(x,Y[1]);c.stroke()}
for(const n of song.ev){const x=CX+XT(n.t)-xp;if(x<HDR-20)continue;if(x>W+20)break;
const col=mode=='listen'&&n.t>=ps-.001&&n.t<=pos&&pos<n.t+n.dur?(n.hand=='L'?C.hr:C.ex):n.st=='hit'?'#1f9d55':n.st=='miss'?'#d63c3c':!isSel(n)?C.gr:C.ink;n.rest?drawRest(n,x,col):drawNote(n,x,col)}
if(song.grps.length)drawBeams();
c.restore();
c.fillStyle=C.pa;c.fillRect(0,0,HDR,SH);c.strokeStyle=C.ln;
for(let r=0;r<2;r++)for(let l=0;l<5;l++){c.beginPath();c.moveTo(0,Y[r]-l*S);c.lineTo(HDR,Y[r]-l*S);c.stroke()}
c.beginPath();c.moveTo(1,Y[0]-4*S);c.lineTo(1,Y[1]);c.stroke();
if(fontOK){c.fillStyle=C.ink;c.font=`${4*S}px Bravura`;G(GL.g,8,Y[0]-S);G(GL.f,8,Y[1]-3*S);
const fa=song.fifths;for(let r=0;r<2;r++)for(let i=0;i<Math.abs(fa);i++)G(fa>0?GL.s:GL.b,48+i*9,yOf(r,(fa>0?TS:TF)[r][i]));
const tx=48+Math.abs(fa)*9+14,dg=(v,y)=>String(v).split('').forEach((ch,i)=>G(String.fromCodePoint(0xE080+ +ch),tx+i*12,y));
for(let r=0;r<2;r++){dg(song.ts[0],Y[r]-2*S);dg(song.ts[1],Y[r])}}
c.strokeStyle=C.cur;c.lineWidth=2;c.beginPath();c.moveTo(CX,Y[0]-6*S);c.lineTo(CX,Y[1]+S);c.stroke();
c.restore();W=Wr;keys(exp,hear)}else{c.restore();W=Wr;keys(new Set(),new Map())}
if(!song){c.fillStyle='#666';c.font='16px system-ui';c.fillText('Aquí aparecerá la partitura',HDR,Y[0]-10)}}
function keys(exp,hear){const wk=[];for(let m=21;m<=108;m++)if(!PCA[m%12])wk.push(m);const w=W/wk.length,kh=KH,x0=0;
wk.forEach((m,i)=>{c.fillStyle=pressed.has(m)?C.ac:hear.has(m)?(hear.get(m)=='L'?C.hr:C.ex):exp.has(m)?C.ex:C.kw;c.fillRect(x0+i*w+1,KY,w-2,kh);c.strokeStyle=C.kl;c.lineWidth=1;c.strokeRect(x0+i*w+1,KY,w-2,kh)});
for(let m=21;m<=108;m++)if(PCA[m%12]){const i=wk.indexOf(m-1);c.fillStyle=pressed.has(m)?C.ac:hear.has(m)?(hear.get(m)=='L'?C.hr:C.ex2):exp.has(m)?C.ex2:C.kb;c.fillRect(x0+(i+1)*w-w*.3,KY,w*.6,kh*.6)}}
function loop(){if(song){
if(mode=='listen'||mode=='tempo'){pos=sp0+(ac.currentTime-t0)*bpm/60;
if(mode=='tempo'){for(const n of song.ev){if(n.t>pos)break;if(!n.rest&&!n.st&&isSel(n)&&n.t>=lo&&n.t+.6<pos){n.st='miss';miss++;stat()}}}
if(pos>song.end+.5){mode=='tempo'?finish():(mode='idle')}}
else if(mode=='wait'&&!dr){const g=group();if(g.length)pos+=(g[0].t-pos)*.15;else finish()}}
draw();requestAnimationFrame(loop)}
function size(){KY=SH*Z+10;W=cv.clientWidth;KH=Math.min(150,Math.max(60,W/52*4.5));H=KY+KH+8;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cv.style.height=H+'px'}
$('cg').onclick=()=>$('cfg').showModal();$('cc').onclick=()=>$('cfg').close();$('th').onchange=e=>theme(e.target.value);

$('vl').oninput=e=>{vol=e.target.value/100;$('vv').textContent=e.target.value+'%';if(mg)mg.gain.value=vol*2;sv('lpv',e.target.value)};

cv.onpointerdown=e=>{if(!song||e.offsetY>KY)return;dr={x:e.clientX,xp:XT(pos)};cv.setPointerCapture(e.pointerId)};
